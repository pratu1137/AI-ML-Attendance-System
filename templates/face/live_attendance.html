{% extends "base.html" %}
{% block title %}Live Attendance | Attendance System{% endblock %}
{% block content %}
<h1>Live attendance</h1>
<p id="camera-status" role="status">OFFLINE</p>
<div style="position:relative;max-width:720px">
	<video id="camera" autoplay playsinline muted style="display:block;width:100%"></video>
	<canvas id="face-overlay" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
</div>
<p id="detection-result">No frame processed.</p>
<button id="start-camera" type="button">Start camera</button>
<button id="stop-camera" type="button" disabled>Stop camera</button>
<input id="csrf-token" type="hidden" value="{{ csrf_token() }}">
<script src="{{ url_for('static', filename='js/live-attendance.js') }}"></script>
{% endblock %}
