{% extends "base.html" %}
{% block title %}Live Attendance | Attendance System{% endblock %}
{% block content %}
<section class="live-attendance-page">
	<div class="section-heading"><div><p class="eyebrow">REAL-TIME RECOGNITION</p><h1>Live attendance</h1><p class="muted">Position one enrolled student in front of the camera.</p></div><span class="live-pill"><span></span> LIVE CAMERA</span></div>
	<div class="camera-stage">
		<video id="camera" autoplay playsinline muted></video>
		<canvas id="face-overlay" aria-hidden="true"></canvas>
		<div class="camera-status-panel" aria-live="polite">
			<div class="camera-status-row"><span class="status-dot"></span><span>Camera</span><strong id="camera-status">OFFLINE</strong></div>
			<div class="camera-status-row"><span class="status-icon">◉</span><span>Faces detected</span><strong id="faces-detected">0</strong></div>
			<div class="camera-status-row camera-result"><span class="status-icon">✦</span><span>Status</span><strong id="detection-result">Searching for face...</strong></div>
		</div>
	</div>
	<div class="camera-controls"><button class="button button-primary" id="start-camera" type="button">Start camera <span>→</span></button><button class="button button-quiet" id="stop-camera" type="button" disabled>Stop camera</button></div>
</section>
<input id="csrf-token" type="hidden" value="{{ csrf_token() }}">
<script src="{{ url_for('static', filename='js/live-attendance.js') }}"></script>
{% endblock %}
