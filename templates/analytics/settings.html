{% extends "base.html" %}
{% block title %}Attendance Settings | Attendance System{% endblock %}
{% block content %}
<h1>Attendance thresholds</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="warning_threshold">Warning percentage</label><input id="warning_threshold" name="warning_threshold" type="number" min="0" max="100" step="0.01" value="{{ settings.warning_threshold }}" required><label for="detain_threshold">Detain-risk percentage</label><input id="detain_threshold" name="detain_threshold" type="number" min="0" max="100" step="0.01" value="{{ settings.detain_threshold }}" required><label for="target_threshold">Target percentage</label><input id="target_threshold" name="target_threshold" type="number" min="0" max="100" step="0.01" value="{{ settings.target_threshold }}" required><button type="submit">Save thresholds</button></form>
{% endblock %}
